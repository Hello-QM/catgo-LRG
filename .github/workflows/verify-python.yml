name: verify-layer-python

# Python tests for the physics-verification layer (verify_gates + verify_enforcement).
# Scoped to the verification modules so it does not touch the existing CI.

on:
  push:
    paths:
      - "server/catgo/mcp_tools/verify_gates.py"
      - "server/catgo/mcp_tools/verify_enforcement.py"
      - "server/catgo/mcp_tools/test_verify.py"
      - "server/catgo/mcp_tools/provenance.py"
      - "server/catgo/mcp_tools/test_server_paths.py"
  pull_request:
    paths:
      - "server/catgo/mcp_tools/verify_gates.py"
      - "server/catgo/mcp_tools/verify_enforcement.py"
      - "server/catgo/mcp_tools/test_verify.py"
      - "server/catgo/mcp_tools/provenance.py"
      - "server/catgo/mcp_tools/test_server_paths.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # httpx + mcp are needed only because pytest imports the test module through
        # the catgo.mcp_tools package, whose __init__ pulls in server.py; the tests
        # themselves are stdlib-only.
        run: pip install pytest httpx mcp
      - name: Run verification-layer tests (standalone, stdlib-only)
        working-directory: server/catgo/mcp_tools
        run: |
          python test_verify.py
          python provenance.py
          python test_server_paths.py
      - name: Run verification-layer tests (pytest)
        working-directory: server/catgo/mcp_tools
        run: pytest test_verify.py test_server_paths.py -q
