name: verify-layer-python

# Python tests for the physics-verification layer (verify_gates + verify_enforcement).
# Scoped to the verification modules so it does not touch the existing CI.

on:
  push:
    paths:
      - "server/catgo/mcp_tools/verify_gates.py"
      - "server/catgo/mcp_tools/verify_enforcement.py"
      - "server/catgo/mcp_tools/test_verify.py"
  pull_request:
    paths:
      - "server/catgo/mcp_tools/verify_gates.py"
      - "server/catgo/mcp_tools/verify_enforcement.py"
      - "server/catgo/mcp_tools/test_verify.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run verification-layer tests (stdlib-only, no backend)
        working-directory: server/catgo/mcp_tools
        run: pytest test_verify.py -q
