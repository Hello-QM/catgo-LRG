# Build the CatGo iOS app on a GitHub-hosted macOS runner.
#
# iOS apps can ONLY be built on macOS (Xcode + codesign) — this lets you produce
# an iOS build without owning a Mac. Triggered manually.
#
#   • No Apple secrets set  -> builds for the iOS SIMULATOR (unsigned) as a smoke
#     test that the frontend + russh Rust lib compile and bundle for iOS.
#   • Apple signing secrets set -> builds a signed device .ipa you can ship via
#     TestFlight. Add these repo secrets (Settings → Secrets → Actions):
#       APPLE_CERTIFICATE            base64 of your .p12 signing cert
#       APPLE_CERTIFICATE_PASSWORD   the .p12 password
#       APPLE_SIGNING_IDENTITY       e.g. "Apple Distribution: Your Name (TEAMID)"
#       APPLE_PROVISIONING_PROFILE   base64 of your .mobileprovision
#       APPLE_DEVELOPMENT_TEAM       your 10-char Apple Team ID
#     (TestFlight/App Store distribution requires the paid Apple Developer
#      Program, USD 99/yr. A free Apple ID only does 7-day local installs.)
name: iOS build

on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Build a signed device IPA (needs Apple secrets) instead of a simulator smoke build'
        type: boolean
        default: false
      upload:
        description: 'After a signed build, upload the IPA to App Store Connect / TestFlight (needs App Store Connect API key secrets)'
        type: boolean
        default: false
      release_tag:
        description: 'Exact release tag to build and upload (for example, v1.4.6)'
        type: string
        required: false
        default: ''
      exact_tag_backfill:
        description: 'Run the trusted main workflow while building the exact release tag source'
        type: boolean
        required: false
        default: false

jobs:
  ios:
    runs-on: macos-15 # Apple Silicon; carries Xcode 26 (iOS 26 SDK)
    name: Build iOS app
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.release_source.outputs.commit }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # Threaded-ferrox nightly pin (read by the rustup step AND build-wasm.mjs,
      # which the Tauri beforeBuildCommand invokes). Bump only after
      # `pnpm build:wasm && pnpm verify:wasm` passes on the new nightly; keep
      # the pin identical across all workflows that define it.
      CATGO_WASM_NIGHTLY_TOOLCHAIN: "nightly-2026-07-16"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Verify release rights
        run: node scripts/verify-release-rights.mjs

      - name: Verify release version
        env:
          RELEASE_VERSION_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION_REQUIRE_TAG: ${{ inputs.upload }}
        run: node scripts/verify-release-version.mjs

      - name: Verify release source
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_tag }}
          RELEASE_SOURCE_REQUIRE_TAG: ${{ inputs.upload }}
        run: node scripts/verify-release-source.mjs

      - name: Record exact release source
        id: release_source
        env:
          ALLOW_EXACT_TAG_BACKFILL: ${{ inputs.exact_tag_backfill }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUIRE_EVENT_SHA: ${{ inputs.upload }}
          V146_SOURCE_COMMIT: 06c02979b9e917011a63dcbfb09aaad7cfb9430d
          V146_TAG: v1.4.6
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          if [ "$REQUIRE_EVENT_SHA" = "true" ]; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$source_commit" != "$tag_commit" ]; then
              echo "::error::Checked-out source is not the requested release tag."
              exit 1
            fi
            if [ "$source_commit" != "$GITHUB_SHA" ] &&
               { [ "$ALLOW_EXACT_TAG_BACKFILL" != "true" ] ||
                 [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] ||
                 [ "$RELEASE_TAG" != "$V146_TAG" ] ||
                 [ "$source_commit" != "$V146_SOURCE_COMMIT" ]; }; then
              echo "::error::TestFlight source differs from GITHUB_SHA outside a trusted default-branch exact-tag backfill."
              exit 1
            fi
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Stage legal bundle for iOS resources
        run: node scripts/sync-legal-bundle.mjs

      - name: Select Xcode 26 (iOS 26 SDK)
        # App Store Connect now rejects uploads built with the iOS 18.5 SDK —
        # "must be built with the iOS 26 SDK or later (Xcode 26+)". macos-latest
        # still defaults to Xcode 16.4, so explicitly select the newest stable.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode / SDK
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust + iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target add wasm32-unknown-unknown
          # Pinned nightly (with rust-src) for the THREADED ferrox WASM
          # artifact — build-wasm.mjs (via the Tauri beforeBuildCommand)
          # rebuilds std with atomics on it; stable stays the default.
          rustup toolchain install "$CATGO_WASM_NIGHTLY_TOOLCHAIN" --profile minimal \
            --component rust-src --target wasm32-unknown-unknown

      - name: Rust cache
        # Cache the Cargo registry + target dirs so re-runs don't recompile every
        # crate from scratch (~10 min → ~1-2 min). Keyed per-job; the iOS lib +
        # WASM crate target dirs both live under src-tauri/target and the workspace.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            extensions/rust-wasm -> target
          cache-on-failure: true

      - name: Install wasm-pack
        # The Tauri beforeBuildCommand (pnpm desktop:build → build:wasm) compiles
        # the ferrox/chgdiff/catrender WASM crates and hard-fails if wasm-pack is
        # missing. Desktop CI installs it too; mirror that here.
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate documentation chunks
        # vite build imports src/lib/chat/rag.ts → ./docs-chunks.json, which this
        # script generates. Desktop CI runs it too; without it the frontend build
        # fails with "Could not resolve ./docs-chunks.json".
        run: pnpm run build:doc-chunks

      - name: Initialise the iOS project
        # Generates src-tauri/gen/apple (xcodegen-based Xcode project). Idempotent.
        # com.catgo.app (the tauri.conf identifier, kept for Android) is taken on the
        # App Store, so iOS ships under org.catgo.app. Override the identifier just
        # for the iOS commands via --config; Android builds from gen/android with the
        # unchanged tauri.conf identifier. Pass the SAME override on build so any
        # xcodegen regeneration keeps the iOS bundle id.
        run: pnpm tauri ios init --config '{"identifier":"org.catgo.app"}'

      - name: Generate app icons (CatGo cat)
        # MUST run AFTER `ios init`: `tauri icon` only fills the gen/apple
        # Assets.xcassets AppIcon when the iOS project already exists. Run before
        # init and the cat icons land only in src-tauri/icons/ios while init seeds
        # Assets.xcassets with the default Tauri icon (the cyan/yellow "8").
        run: pnpm tauri icon desktop/logo.png

      - name: Flatten app icons (App Store requires opaque, no alpha)
        # desktop/logo.png has an alpha channel, so the generated 1024 marketing
        # icon does too → App Store rejects: "Invalid large app icon … can't be
        # transparent or contain an alpha channel". Composite every AppIcon PNG
        # over the icon's navy background and strip alpha. (iOS/App Store apply
        # their own corner mask, so the filled square corners aren't shown.)
        run: |
          set -euo pipefail
          command -v magick >/dev/null 2>&1 || brew install imagemagick
          count=0
          while IFS= read -r -d '' f; do
            magick "$f" -background '#0d1a3a' -alpha remove -alpha off "$f"
            count=$((count+1))
          done < <(find src-tauri/gen/apple src-tauri/icons/ios -name '*.png' -print0 2>/dev/null)
          echo "Flattened $count icon PNGs (removed alpha)"

      - name: Configure manual code signing
        # The generated project.yml has the right bundle id (org.catgo.app) but no
        # signing settings → automatic signing with no profile → "requires a
        # provisioning profile". Inject manual signing and regenerate with xcodegen.
        # (Info.plist keys — export-compliance + document-type LSHandlerRank /
        # LSSupportsOpeningDocumentsInPlace — are handled at the config layer via
        # bundle.iOS.infoPlist + fileAssociation rank, which survive the build's
        # Info.plist regeneration; PlistBuddy here would be wiped by it.)
        if: ${{ inputs.signed }}
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          awk -v team="$APPLE_DEVELOPMENT_TEAM" '
            { print }
            /^      PRODUCT_BUNDLE_IDENTIFIER: org\.catgo\.app/ {
              print "      CODE_SIGN_STYLE: Manual"
              print "      DEVELOPMENT_TEAM: " team
              print "      PROVISIONING_PROFILE_SPECIFIER: CatGo_App_Store"
              print "      CODE_SIGN_IDENTITY: Apple Distribution"
            }
          ' project.yml > project.yml.new && mv project.yml.new project.yml
          xcodegen generate
          echo "=== pbxproj signing ==="
          grep -hoE "(CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY) = [^;]+;" catgo.xcodeproj/project.pbxproj | sort -u

      # ---- Unsigned simulator smoke build (no Apple account needed) ----
      - name: Build (simulator, unsigned)
        if: ${{ !inputs.signed }}
        run: pnpm tauri ios build --target aarch64-sim --config '{"identifier":"org.catgo.app"}'

      # ---- Signed device IPA ----
      # Manual signing via Tauri's native env vars: Tauri imports the cert into a
      # temp keychain, installs the provisioning profile, configures the Xcode
      # project for manual signing, and writes a matching ExportOptions.plist. This
      # is deterministic — no Apple ID login and no cloud-signing permission issues.
      - name: Build (signed device IPA)
        if: ${{ inputs.signed }}
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          # Production (no Mac/LAN, no Python sidecar on mobile): build static-only
          # so stray backend fetches return a friendly 503 instead of hanging on
          # localhost. Mobile-native paths still work — local structure view/edit,
          # database import (rerouted via isMobile() direct fetch), and the SSH
          # terminal/files (russh over Tauri invoke, not HTTP). Backend-only UI
          # (chat/workflow/plugin_hub) is already hidden on mobile.
          VITE_STATIC_ONLY: '1'
        # bundleVersion (CFBundleVersion) must be STRICTLY INCREASING per upload
        # for App Store Connect — a fixed value (previously the marketing
        # version) makes every re-upload of the same app version fail with
        # ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE. github.run_number is
        # monotonic per workflow, so every run is uploadable.
        run: >
          pnpm tauri ios build --export-method app-store-connect
          --config '{"identifier":"org.catgo.app","bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'

      - name: Verify legal bundle in iOS artifacts
        run: |
          set -euo pipefail
          inspected=0
          while IFS= read -r -d '' ipa; do
            unzip -Z1 "$ipa" > ios-archive.lst
            while IFS= read -r file; do
              rel="${file#build/legal-bundle/}"
              if ! grep -Fq "/legal/$rel" ios-archive.lst; then
                echo "::error::$ipa is missing legal/$rel"
                exit 1
              fi
            done < <(find build/legal-bundle -type f | sort)
            inspected=$((inspected + 1))
          done < <(find src-tauri/gen/apple/build -type f -name '*.ipa' -print0)
          while IFS= read -r -d '' app; do
            while IFS= read -r file; do
              rel="${file#build/legal-bundle/}"
              if ! find "$app" -type f -path "*/legal/$rel" -print -quit | grep -q .; then
                echo "::error::$app is missing legal/$rel"
                exit 1
              fi
            done < <(find build/legal-bundle -type f | sort)
            inspected=$((inspected + 1))
          done < <(find src-tauri/gen/apple/build -type d -name '*.app' -print0)
          if [ "$inspected" -eq 0 ]; then
            echo "::error::No iOS IPA/app found for legal-bundle inspection"
            exit 1
          fi

      # ---- Upload the signed IPA to App Store Connect (TestFlight) ----
      # Needs an App Store Connect API key (App Store Connect → Users and Access →
      # Integrations → App Store Connect API). Add these repo secrets:
      #   APPLE_API_KEY_ID      the key's Key ID
      #   APPLE_API_ISSUER_ID   the Issuer ID shown on that page
      #   APPLE_API_KEY_P8      the full contents of the downloaded AuthKey_*.p8
      - name: Upload to App Store Connect (TestFlight)
        if: ${{ inputs.signed && inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_ID}" ] || [ -z "${APPLE_API_ISSUER_ID}" ] || [ -z "${APPLE_API_KEY_P8}" ]; then
            echo "::error::Upload requested but App Store Connect API key secrets are missing (APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_P8)."
            exit 1
          fi
          # altool/xcrun looks the key up by ID under these well-known dirs.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${APPLE_API_KEY_P8}" > ~/".appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' -print -quit)
          if [ -z "${IPA}" ]; then echo "::error::No .ipa found to upload"; exit 1; fi
          echo "Uploading ${IPA} to App Store Connect…"
          # altool can print validation errors but still exit 0. Fail closed:
          # require both a zero exit code and its explicit positive acceptance
          # marker; empty, truncated, negative, or unfamiliar output is failure.
          set +e
          OUT=$(xcrun altool --upload-app -f "${IPA}" -t ios \
            --apiKey "${APPLE_API_KEY_ID}" --apiIssuer "${APPLE_API_ISSUER_ID}" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          rm -f ~/".appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$OUT" |
            node scripts/verify-testflight-upload-result.mjs --exit-code "$RC"

      - name: Upload artifacts
        # always() so a successfully-built+signed IPA is saved even when the
        # TestFlight upload step flakes — download it and submit via Transporter
        # without a full rebuild.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catgo-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

  publish-testflight-attestation:
    name: Attach TestFlight acceptance attestation
    needs: ios
    if: ${{ inputs.signed && inputs.upload && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ALLOW_EXACT_TAG_BACKFILL: ${{ inputs.exact_tag_backfill }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SOURCE_COMMIT: ${{ needs.ios.outputs.source_commit }}
      REPOSITORY: ${{ github.repository }}
      V146_SOURCE_COMMIT: 06c02979b9e917011a63dcbfb09aaad7cfb9430d
      V146_TAG: v1.4.6
    steps:
      - name: Confirm matching release is a draft
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid CatGo release tag: $RELEASE_TAG"
            exit 1
          fi
          if ! [[ "$RELEASE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$RELEASE_SOURCE_COMMIT" != \
               "$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" ]; then
            echo "::error::TestFlight source is not the exact release tag commit."
            exit 1
          fi
          if [ "$RELEASE_SOURCE_COMMIT" != "$GITHUB_SHA" ] &&
             { [ "$ALLOW_EXACT_TAG_BACKFILL" != "true" ] ||
               [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] ||
               [ "$RELEASE_TAG" != "$V146_TAG" ] ||
               [ "$RELEASE_SOURCE_COMMIT" != "$V146_SOURCE_COMMIT" ]; }; then
            echo "::error::Untrusted TestFlight exact-tag backfill context."
            exit 1
          fi
          draft=$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')
          if [ "$draft" != "true" ]; then
            echo "::error::Release $RELEASE_TAG must still be a draft."
            exit 1
          fi

      - name: Upload accepted TestFlight attestation
        run: |
          set -euo pipefail
          attestation="catgo-ios-testflight-${RELEASE_TAG}.json"
          jq -n \
            --arg releaseTag "$RELEASE_TAG" \
            --arg sourceCommit "$RELEASE_SOURCE_COMMIT" \
            --arg githubRunId "$GITHUB_RUN_ID" \
            '{
              "schemaVersion": 1,
              "releaseTag": $releaseTag,
              "sourceCommit": $sourceCommit,
              "githubRunId": $githubRunId,
              "status": "accepted"
            }' > "$attestation"
          gh release upload "$RELEASE_TAG" "$attestation" \
            --repo "$REPOSITORY" \
            --clobber
