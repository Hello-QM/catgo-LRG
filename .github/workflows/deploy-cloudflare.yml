name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "desktop/**"
      # Rust WASM SOURCES — CI rebuilds these crates into the web bundle, so a
      # fix here must trigger a redeploy. Previously only the gitignored built
      # `extensions/rust-wasm/**` pkg (which never changes in git) was watched,
      # so Rust source fixes (e.g. slab stoichiometry #158) silently shipped a
      # STALE wasm to the live web. See also build:wasm in package.json.
      - "extensions/rust/**"
      - "extensions/chgdiff-wasm/**"
      - "extensions/catrender-wasm/**"
      - "extensions/rust-wasm/**"
      - "static/**"
      - "license"
      - "CITATION.cff"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/licenses/**"
      - "third_party/provenance/**"
      - "scripts/sync-legal-bundle.mjs"
      - "scripts/verify-legal-distributions.mjs"
      - "scripts/verify-release-rights.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.desktop.config.ts"
      - "vite.shared.ts"
      - "svelte.config.js"
      - "wrangler.docs.toml"
      - "wrangler.app.toml"
      - "wrangler.downloads.toml"
      - "workers/downloads/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Threaded-ferrox nightly pin (read by the dtolnay step AND build-wasm.mjs).
  # Bump only after `pnpm build:wasm && pnpm verify:wasm` passes on the new
  # nightly; keep the pin identical across all workflows that define it.
  CATGO_WASM_NIGHTLY_TOOLCHAIN: "nightly-2026-07-16"

jobs:
  deploy-docs:
    name: Deploy docs.catgo-ucsd.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify release rights
        run: node scripts/verify-release-rights.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - name: Verify legal retention for static deployments
        run: pnpm legal:verify

      - name: Inject cache headers
        run: |
          cat > docs/.vitepress/dist/_headers <<'EOF'
          /assets/*
            Cache-Control: public, max-age=31536000, immutable

          /*.woff2
            Cache-Control: public, max-age=31536000, immutable

          /*.woff
            Cache-Control: public, max-age=31536000, immutable

          /index.html
            Cache-Control: public, max-age=0, must-revalidate

          /
            Cache-Control: public, max-age=0, must-revalidate
          EOF

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.90.1'
          command: deploy --config wrangler.docs.toml

  deploy-app:
    name: Deploy app.catgo-ucsd.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify release rights
        run: node scripts/verify-release-rights.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Nightly (with rust-src) builds the THREADED ferrox artifact — std is
      # rebuilt with atomics via -Z build-std. Installed before stable so
      # stable stays the default toolchain for everything else. Pinned via
      # CATGO_WASM_NIGHTLY_TOOLCHAIN — see env at the top of this file.
      - name: Setup Rust nightly (threaded ferrox WASM)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CATGO_WASM_NIGHTLY_TOOLCHAIN }}
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions/rust -> target
            extensions/chgdiff-wasm -> target

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: pnpm install --frozen-lockfile

      # Single canonical entry point for ALL wasm builds (design §8.3): it
      # builds ferrox twice with explicit feature sets (wasm-scalar →
      # pkg-scalar/+pkg/, wasm-threaded → pkg-threaded/) plus chgdiff +
      # catrender into their src/lib out-dirs. Never invoke wasm-pack directly
      # here — `--features wasm` without --no-default-features is a compile
      # error by design (lib.rs guard against default-Rayon wasm with no
      # thread pool).
      - name: Build WASM extensions (ferrox + chgdiff + catrender)
        run: pnpm build:wasm

      - name: Verify WASM artifacts (scalar + threaded ferrox)
        run: node scripts/verify-wasm-artifacts.mjs

      - name: Generate docs-chunks.json for CatBot RAG
        run: pnpm build:doc-chunks

      - name: Build static SPA (VITE_STATIC_ONLY=true)
        run: pnpm deploy:build

      - name: Verify legal retention for static deployments
        run: pnpm legal:verify

      - name: Inject cache + isolation headers
        run: |
          # Remove the dev-only _redirects shipped under build-desktop/;
          # wrangler.app.toml uses not_found_handling = "single-page-application"
          # which conflicts with a wildcard _redirects rule.
          rm -f build-desktop/_redirects

          cat > build-desktop/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
            Cross-Origin-Resource-Policy: same-origin

          /assets/*
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin

          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin

          /*.woff2
            Cache-Control: public, max-age=31536000, immutable

          /*.woff
            Cache-Control: public, max-age=31536000, immutable

          /index.html
            Cache-Control: public, max-age=0, must-revalidate

          /
            Cache-Control: public, max-age=0, must-revalidate
          EOF

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.90.1'
          command: deploy --config wrangler.app.toml

  deploy-downloads:
    name: Deploy dl.catgo-ucsd.org
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify release rights
        run: node scripts/verify-release-rights.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.90.1'
          command: deploy --config wrangler.downloads.toml
