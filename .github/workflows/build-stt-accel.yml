name: Build STT accelerator

# Builds prebuilt whisper.cpp `whisper-cli` (GPU backends) for the optional
# in-app STT accelerator and attaches them — plus a manifest the app reads — to
# a GitHub Release. Not part of the app release; cut on demand.
#   Vulkan → Linux/Windows (AMD/Intel iGPU);  Metal → macOS (Apple Silicon).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish assets under
        default: stt-accel-v1
  push:
    tags: ['stt-accel-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            key: linux-x64-vulkan
            backend: vulkan
            ext: tar.gz
          - os: macos-latest
            key: macos-arm64-metal
            backend: metal
            ext: tar.gz
          - os: windows-latest
            key: windows-x64-vulkan
            backend: vulkan
            ext: zip
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "TAG=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_ENV"

      - name: Verify target STT release rights
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_COMMIT: ${{ github.sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
            rights_commit=$(git rev-parse "$tag^{commit}")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            rights_commit="$EVENT_SOURCE_COMMIT"
            git cat-file -e "$rights_commit^{commit}"
          else
            echo "::error::The pushed STT tag could not be resolved."
            exit 1
          fi
          target_rights_source=$(mktemp -d)
          rmdir "$target_rights_source"
          cleanup() {
            git worktree remove --force \
              "$target_rights_source" 2>/dev/null || true
          }
          trap cleanup EXIT
          git worktree add --detach "$target_rights_source" "$rights_commit"
          node scripts/verify-release-rights.mjs \
            --root "$target_rights_source"
          cleanup
          trap - EXIT
          git checkout --detach "$rights_commit"
          echo "RIGHTS_COMMIT=$rights_commit" >> "$GITHUB_ENV"

      - name: Stage canonical legal bundle
        run: node scripts/sync-legal-bundle.mjs

      - name: Resolve pinned whisper.cpp revision
        shell: bash
        run: |
          revision="$(node -p "require('./scripts/whispercpp-source.json').revision")"
          echo "WHISPER_CPP_REVISION=$revision" >> "$GITHUB_ENV"

      - name: Install Vulkan toolchain (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake glslc glslang-tools spirv-headers libvulkan-dev

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash scripts/build-whispercpp.sh ${{ matrix.backend }} "dist/${{ matrix.key }}" "$WHISPER_CPP_REVISION"

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Clone into RUNNER_TEMP, NOT "src" — the repo (checked out here) already
          # has its own src/ directory, so `git clone ... src` would collide.
          $wc = Join-Path $env:RUNNER_TEMP 'whispercpp'
          $source = Get-Content scripts/whispercpp-source.json | ConvertFrom-Json
          if ($env:WHISPER_CPP_REVISION -ne $source.revision) {
            throw "workflow revision does not match pinned whisper.cpp source"
          }
          git init $wc
          git -C $wc remote add origin $source.repository
          git -C $wc fetch --depth 1 origin $source.revision
          git -C $wc checkout --detach FETCH_HEAD
          if ((git -C $wc rev-parse HEAD) -ne $source.revision) {
            throw "whisper.cpp checkout does not match pinned revision"
          }
          if (-not (Test-Path "$wc/CMakeLists.txt")) { throw "whisper.cpp clone failed" }
          cmake -S $wc -B $wc/build -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=1
          cmake --build $wc/build --config Release --target whisper-cli
          New-Item -ItemType Directory -Force "dist/${{ matrix.key }}" | Out-Null
          Copy-Item "$wc/build/bin/Release/*" "dist/${{ matrix.key }}/" -Recurse -Force
          node scripts/stage-whispercpp-license.mjs --source-root $wc --output "dist/${{ matrix.key }}"

      - name: Package + checksum
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.key }}/legal"
          cp -r build/legal-bundle/. "dist/${{ matrix.key }}/legal/"
          mkdir -p out
          asset="whisper-cli-${{ matrix.key }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            ( cd "dist/${{ matrix.key }}" && 7z a -tzip "$GITHUB_WORKSPACE/out/$asset" . )
          else
            tar -C "dist/${{ matrix.key }}" -czf "out/$asset" .
          fi
          if command -v sha256sum >/dev/null; then
            sha=$(sha256sum "out/$asset" | awk '{print $1}')
          else
            sha=$(shasum -a 256 "out/$asset" | awk '{print $1}')
          fi
          echo "$sha" > "out/$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Verify legal bundle in accelerator archive
        shell: bash
        run: node scripts/verify-stt-archive.mjs --archive "out/$ASSET" --legal-root build/legal-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: out/*

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --latest=false \
              --target "$RIGHTS_COMMIT" --title "$TAG" \
              --notes "CatGo STT GPU accelerator binaries. Each archive includes the CatGo legal and citation bundle."
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          published_commit=$(git rev-parse "$TAG^{commit}")
          if [ "$published_commit" != "$RIGHTS_COMMIT" ]; then
            echo "::error::STT release tag moved away from the rights-cleared source."
            exit 1
          fi
          gh release upload "$TAG" "out/$ASSET" "out/$ASSET.sha256" --clobber

  manifest:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "TAG=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_ENV"
      - name: Verify target STT release rights
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          rights_commit=$(git rev-parse "$tag^{commit}")
          target_rights_source=$(mktemp -d)
          rmdir "$target_rights_source"
          cleanup() {
            git worktree remove --force \
              "$target_rights_source" 2>/dev/null || true
          }
          trap cleanup EXIT
          git worktree add --detach "$target_rights_source" "$rights_commit"
          node scripts/verify-release-rights.mjs \
            --root "$target_rights_source"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble manifest
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/$REPO/releases/download/$TAG"
          python3 - "$BASE" <<'PY'
          import json, sys, glob, os
          base = sys.argv[1]
          binaries = {}
          for shafile in glob.glob('artifacts/**/*.sha256', recursive=True):
              asset = os.path.basename(shafile)[:-len('.sha256')]
              key = asset[len('whisper-cli-'):]
              for suf in ('.tar.gz', '.zip'):
                  if key.endswith(suf):
                      key = key[:-len(suf)]
                      break
              binaries[key] = {'url': f'{base}/{asset}', 'sha256': open(shafile).read().strip()}
          json.dump({'version': '1', 'binaries': binaries},
                    open('stt-accel-manifest.json', 'w'), indent=2)
          print(open('stt-accel-manifest.json').read())
          PY
      - name: Upload manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # manifest job has no checkout → tell gh the repo
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" stt-accel-manifest.json --clobber
