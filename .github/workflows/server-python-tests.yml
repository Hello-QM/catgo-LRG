name: server-python-tests

# The repo had no CI job running pytest at all, so every Python test in
# server/ was a local-only safety net. This runs the suites covering the
# agent -> viewer path (structure/analysis/result/trajectory publication,
# the MCP dispatch contract, and cross-thread SSE delivery).

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-python-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # Install what the SERVER declares, not a hand-written list. The first
        # version of this job hand-wrote one, omitted fastapi, and every router
        # test died at collection. The mcp<2 cap now lives in requirements.txt
        # where a fresh install sees it too, so nothing is repeated here.
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Module self-tests (python <module>.py)
        working-directory: server
        env:
          PYTHONPATH: .
        run: python catgo/workflow/viewer_publish.py
      - name: Agent-to-viewer publication suites
        working-directory: server
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_analysis_announce.py \
            tests/test_node_result_publish.py \
            tests/test_path_trajectory_publish.py \
            tests/test_publish_safety.py \
            tests/test_publish_hardening.py \
            tests/test_sse_cross_thread.py \
            tests/test_agent_viewer_adaptation.py \
            tests/test_mcp_tool_dispatch.py \
            tests/test_view_state_pane_routing.py \
            tests/test_view_current_fallback.py
