name: Publish VSCode Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package only — do not publish to marketplace'
        type: boolean
        default: false

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Threaded-ferrox nightly pin (read by the dtolnay step AND build-wasm.mjs).
  # Bump only after `pnpm build:wasm && pnpm verify:wasm` passes on the new
  # nightly; keep the pin identical across all workflows that define it.
  CATGO_WASM_NIGHTLY_TOOLCHAIN: "nightly-2026-07-16"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Install extension deps
        working-directory: extensions/vscode
        run: pnpm install --frozen-lockfile

      # Nightly (with rust-src) builds the THREADED ferrox artifact — std is
      # rebuilt with atomics via -Z build-std. Installed before stable so
      # stable stays the default toolchain for everything else. Pinned via
      # CATGO_WASM_NIGHTLY_TOOLCHAIN — see env at the top of this file.
      - name: Setup Rust nightly (threaded ferrox WASM)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CATGO_WASM_NIGHTLY_TOOLCHAIN }}
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Single canonical entry point for ALL wasm builds (design §8.3): it
      # builds ferrox twice with explicit feature sets (wasm-scalar →
      # pkg-scalar/+pkg/, wasm-threaded → pkg-threaded/) plus chgdiff +
      # catrender. Never invoke wasm-pack directly here — `--features wasm`
      # without --no-default-features is a compile error by design (lib.rs
      # guard against default-Rayon wasm with no thread pool).
      - name: Build WASM extensions (ferrox + chgdiff + catrender)
        run: |
          export PATH=$PATH:$HOME/.cargo/bin
          pnpm build:wasm

      - name: Verify WASM artifacts (scalar + threaded ferrox)
        run: node scripts/verify-wasm-artifacts.mjs

      - name: Build documentation chunks
        run: pnpm run build:doc-chunks

      # Single source of truth for the version: the VS Code extension always
      # inherits the root package.json version at publish time. Prevents
      # shipping a stale .vsix when a release bump forgets to update
      # extensions/vscode/package.json (this happened for v1.1.1).
      - name: Sync extension version from root package.json
        run: |
          root_ver=$(node -p "require('./package.json').version")
          npm --prefix extensions/vscode pkg set version="$root_ver"
          echo "Extension version synced to $root_ver"

      - name: Build extension
        working-directory: extensions/vscode
        run: pnpm build

      - name: Package VSIX
        working-directory: extensions/vscode
        run: pnpm dlx @vscode/vsce package --no-dependencies

      # Real publish failures (bad token, network, packaging) now fail the job
      # loudly instead of being swallowed by continue-on-error. The ONLY
      # tolerated error is "already published" — keeps re-tagging the same
      # version idempotent without masking genuine breakage.
      - name: Publish to VS Code Marketplace
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set +e
          out=$(pnpm dlx @vscode/vsce publish --no-dependencies --packagePath catgo-*.vsix 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qiE "already (exists|published)"; then
              echo "::warning::Version already on the VS Code Marketplace — treating as a no-op (idempotent re-tag)."
            else
              echo "::error::vsce publish failed (exit $code)."
              exit "$code"
            fi
          fi

      # Claim ownership of the Open VSX namespace so published extensions are not
      # flagged "not a verified publisher of the namespace". The token's account
      # becomes the namespace owner. Idempotent: a namespace that already exists
      # (owned by this account from a prior run) is a tolerated no-op. If the
      # namespace exists but is owned by a DIFFERENT account, this step warns and
      # the one-time ownership transfer must be requested manually — see
      # deploy/vscode/OPEN-VSX-NAMESPACE.md.
      - name: Ensure Open VSX namespace ownership
        if: ${{ (github.event_name == 'push' || inputs.dry_run == false) && env.OVSX_PAT != '' }}
        working-directory: extensions/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set +e
          ns=$(node -p "require('./package.json').publisher")
          out=$(pnpm dlx ovsx create-namespace "$ns" 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && ! echo "$out" | grep -qiE "already (exists|owned)"; then
            echo "::warning::Could not create/claim Open VSX namespace '$ns' (exit $code). If it is owned by another account, request ownership manually — see deploy/vscode/OPEN-VSX-NAMESPACE.md."
          fi

      - name: Publish to Open VSX (Cursor / VSCodium / Theia)
        if: ${{ (github.event_name == 'push' || inputs.dry_run == false) && env.OVSX_PAT != '' }}
        working-directory: extensions/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set +e
          vsix=$(ls catgo-*.vsix | head -1)
          out=$(pnpm dlx ovsx publish "$vsix" --no-dependencies 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qiE "already (exists|published)"; then
              echo "::warning::Version already on Open VSX — treating as a no-op (idempotent re-tag)."
            else
              echo "::error::ovsx publish failed (exit $code)."
              exit "$code"
            fi
          fi

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catgo-vsix
          path: extensions/vscode/catgo-*.vsix
          retention-days: 90

      - name: Attach VSIX to GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          vsix=$(ls extensions/vscode/catgo-*.vsix | head -1)
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes "Release $tag"
          gh release upload "$tag" "$vsix" --clobber
          # The platform sidecar binaries (catgo-server-{linux-x64,darwin-arm64,
          # win-x64.exe}) that src/sidecar.ts downloads on first activate are
          # built and attached by the separate build-vscode-sidecars.yml
          # workflow — they can't be produced on this single Linux runner, and
          # the old `[ -f ] && upload` loop here silently uploaded nothing.
