name: Build HPC Bundle

# Builds the pre-built frontend + server bundle that the install-catgo.sh
# installer downloads on HPC systems (which don't have Node.js).

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/hpc-bundle.yml'
      - 'desktop/**'
      - 'docs/**'
      - 'extensions/**'
      - 'scripts/build-doc-chunks.js'
      - 'src/**'
      - 'server/**'
      - 'static/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.desktop.config.ts'
      - 'vite.shared.ts'
      - 'svelte.config.js'
  workflow_dispatch:

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Threaded-ferrox nightly pin (read by the dtolnay step AND build-wasm.mjs).
  # Bump only after `pnpm build:wasm && pnpm verify:wasm` passes on the new
  # nightly; keep the pin identical across all workflows that define it.
  CATGO_WASM_NIGHTLY_TOOLCHAIN: "nightly-2026-07-16"

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nightly (with rust-src) builds the THREADED ferrox artifact — std is
      # rebuilt with atomics via -Z build-std. Installed before stable so
      # stable stays the default toolchain for everything else. Pinned via
      # CATGO_WASM_NIGHTLY_TOOLCHAIN — see env at the top of this file.
      - name: Setup Rust nightly (threaded ferrox WASM)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CATGO_WASM_NIGHTLY_TOOLCHAIN }}
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Generate SvelteKit tsconfig + ambient types
        run: pnpm exec svelte-kit sync

      # Single canonical entry point for ALL wasm builds (design §8.3): it
      # builds ferrox twice with explicit feature sets (wasm-scalar →
      # pkg-scalar/+pkg/, wasm-threaded → pkg-threaded/) plus chgdiff +
      # catrender. Never invoke wasm-pack directly here — `--features wasm`
      # without --no-default-features is a compile error by design (lib.rs
      # guard against default-Rayon wasm with no thread pool).
      - name: Build WASM extensions
        run: |
          export PATH=$PATH:$HOME/.cargo/bin
          pnpm build:wasm

      - name: Verify WASM artifacts (scalar + threaded ferrox)
        run: node scripts/verify-wasm-artifacts.mjs

      - name: Build documentation chunks
        run: pnpm run build:doc-chunks

      - name: Build frontend
        run: pnpm run deploy:build

      - name: Create HPC bundle
        run: |
          BUNDLE_DIR="catgo-hpc-bundle"
          mkdir -p "$BUNDLE_DIR"

          # Copy pre-built frontend
          cp -r build-desktop "$BUNDLE_DIR/frontend"

          # Copy server (Python backend)
          cp -r server "$BUNDLE_DIR/server"

          # Remove __pycache__ and .pyc files
          find "$BUNDLE_DIR/server" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find "$BUNDLE_DIR/server" -name "*.pyc" -delete 2>/dev/null || true

          # Create tarball
          tar czf catgo-hpc-bundle.tar.gz -C "$BUNDLE_DIR" frontend server

          echo "Bundle contents:"
          tar tzf catgo-hpc-bundle.tar.gz | head -20
          echo "..."
          echo "Bundle size: $(du -h catgo-hpc-bundle.tar.gz | cut -f1)"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: catgo-hpc-bundle
          path: catgo-hpc-bundle.tar.gz
          retention-days: 90

      # Attach to release when triggered by a tag
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: catgo-hpc-bundle.tar.gz
          draft: true
