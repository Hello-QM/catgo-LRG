name: Test Build (Manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - macos-intel

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Threaded-ferrox nightly pin (read by the dtolnay step AND build-wasm.mjs).
  # Bump only after `pnpm build:wasm && pnpm verify:wasm` passes on the new
  # nightly; keep the pin identical across all workflows that define it.
  CATGO_WASM_NIGHTLY_TOOLCHAIN: "nightly-2026-07-16"

jobs:
  build-windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    name: Build Windows
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          channels: conda-forge
          auto-activate-base: false
          activate-environment: catgo

      - name: Install Python dependencies
        run: |
          conda install -y -c conda-forge openbabel pip
          python -m pip install --upgrade pip
          pip install pyinstaller
          grep -iv '^openbabel' server/requirements.txt > reqs_no_ob.txt
          pip install -r reqs_no_ob.txt
          rm reqs_no_ob.txt

      - name: Build backend
        run: |
          cd server
          python -m PyInstaller catgo_server.spec --noconfirm
          mkdir -p ../src-tauri/binaries
          cp dist/catgo-server.exe ../src-tauri/binaries/catgo-server-x86_64-pc-windows-msvc.exe

      # Nightly (with rust-src) builds the THREADED ferrox artifact — std is
      # rebuilt with atomics via -Z build-std. Installed before stable so
      # stable stays the default toolchain for everything else. Pinned via
      # CATGO_WASM_NIGHTLY_TOOLCHAIN — see env at the top of this file.
      - name: Setup Rust nightly (threaded ferrox WASM)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CATGO_WASM_NIGHTLY_TOOLCHAIN }}
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # Single canonical entry point for ALL wasm builds (design §8.3): it
      # builds ferrox twice with explicit feature sets (wasm-scalar →
      # pkg-scalar/+pkg/, wasm-threaded → pkg-threaded/) plus chgdiff +
      # catrender. Never invoke wasm-pack directly here — `--features wasm`
      # without --no-default-features is a compile error by design (lib.rs
      # guard against default-Rayon wasm with no thread pool).
      - name: Build WASM extensions
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          export PATH=$PATH:$HOME/.cargo/bin
          pnpm build:wasm

      - name: Verify WASM artifacts (scalar + threaded ferrox)
        run: node scripts/verify-wasm-artifacts.mjs

      - name: Generate documentation chunks
        run: pnpm run build:doc-chunks

      - name: Generate icons
        run: node scripts/generate-icons.js

      - name: Build Tauri app
        run: pnpm tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatGo-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  build-macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    name: Build macOS (Apple Silicon)
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          channels: conda-forge
          auto-activate-base: false
          activate-environment: catgo

      - name: Install Python dependencies
        run: |
          conda install -y -c conda-forge openbabel pip
          python -m pip install --upgrade pip
          pip install pyinstaller
          grep -iv '^openbabel' server/requirements.txt > reqs_no_ob.txt
          pip install -r reqs_no_ob.txt
          rm reqs_no_ob.txt

      - name: Build backend
        run: |
          cd server
          python -m PyInstaller catgo_server.spec --noconfirm
          mkdir -p ../src-tauri/binaries
          cp dist/catgo-server ../src-tauri/binaries/catgo-server-aarch64-apple-darwin
          chmod +x ../src-tauri/binaries/catgo-server-aarch64-apple-darwin

      # Nightly (with rust-src) builds the THREADED ferrox artifact — std is
      # rebuilt with atomics via -Z build-std. Installed before stable so
      # stable stays the default toolchain for everything else. Pinned via
      # CATGO_WASM_NIGHTLY_TOOLCHAIN — see env at the top of this file.
      - name: Setup Rust nightly (threaded ferrox WASM)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CATGO_WASM_NIGHTLY_TOOLCHAIN }}
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # Single canonical entry point for ALL wasm builds (design §8.3): it
